name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web_search/**"
      - "06_semantic_hybrid_search/export_browser_index.py"
      - "06_semantic_hybrid_search/eo_search_lib.py"
      - "06_semantic_hybrid_search/artifacts/full_index_manifest.json"
      - "03_harmonization/data/eo_l3_l4_canonical_products.parquet"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "web_search/**"
      - "06_semantic_hybrid_search/export_browser_index.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static catalogue, browser search index & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web_search/pnpm-lock.yaml

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install frontend dependencies
        run: pnpm --dir web_search install --frozen-lockfile

      - name: Build static site & Advanced Search bundle
        run: pnpm --dir web_search build

      - name: Export 512-d browser search index from Release assets
        run: uv run 06_semantic_hybrid_search/export_browser_index.py --out-dir dist/data/search --dim 512

      - name: Verify browser search engine & Hard-Limits parity
        run: pnpm --dir web_search test

      - name: Verify Pages artifact structure
        run: |
          test -f dist/index.html
          test -f dist/search.html
          test -f dist/sources.html
          test -f dist/.nojekyll
          test -f dist/data/index_meta.json
          test -f dist/data/search/search_manifest.json
          test -f dist/data/search/bm25_index.bin.gz
          test -f dist/data/search/emb_512d_i8_p0.bin.gz
          ls -lh dist/data/search

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
